name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder secrets so Next can compile AuthKit routes in CI.
      # Real values are supplied in Vercel / local `.env.local`.
      WORKOS_CLIENT_ID: client_ci_placeholder
      WORKOS_API_KEY: sk_test_ci_placeholder
      WORKOS_COOKIE_PASSWORD: ci-build-cookie-password-min-32-chars
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/callback
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run content:validate
      - run: pnpm run build
